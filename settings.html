<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .settings-container { 
            min-height: 80vh; 
            background: #050505; 
            color: white; 
            padding: 60px 10%; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }

        .settings-card { 
            width: 100%; 
            max-width: 700px; 
            background: #0a0a0a; 
            padding: 40px; 
            border: 1px solid #111; 
            border-radius: 12px; 
        }
        
        .back-dash {
            align-self: center; 
            width: 100%;
            max-width: 700px; 
            color: #555;
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-dash:hover { color: var(--gold, #C4A484); }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--gold, #C4A484); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .form-group input { width: 100%; background: #000; border: 1px solid #222; padding: 12px; color: white; border-radius: 5px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--gold, #C4A484); }
        
        .save-btn { background: var(--gold, #C4A484); color: #000; border: none; padding: 15px 30px; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 20px; }
        .save-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="settings-container">
    <a href="profile.html" class="back-dash">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>

    <div class="settings-card">
        <h2 style="margin-bottom: 30px; font-weight: 900;">Account Settings</h2>
        
        <form id="settingsForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" name="name">
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" name="email">
            </div>
            
            <div class="form-group">
                <label>New Password (Leave blank to keep current)</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>

            <div style="margin: 40px 0; border-top: 1px solid #111; padding-top: 20px;">
                <h3 style="font-size: 0.9rem; margin-bottom: 15px;">Preferences</h3>
                <label style="display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: #888; cursor: pointer;">
                    <input type="checkbox" id="whatsapp_pref" checked style="width: auto;"> Receive "Brew Ready" WhatsApp notifications
                </label>
            </div>
            
            <button type="submit" class="save-btn">Update Profile</button>
        </form>
    </div>
</div>

<script>
    // Enforce authentication simulation
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || {
        user_name: "Amogelang Matlhaga",
        user_email: "amo@syretech.co.za"
    };

    document.getElementById('name').value = currentUser.user_name;
    document.getElementById('email').value = currentUser.user_email;

    document.getElementById('settingsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        currentUser.user_name = document.getElementById('name').value;
        currentUser.user_email = document.getElementById('email').value;
        
        sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
        alert('Profile updated successfully!');
    });
</script>

</body>
</html>
